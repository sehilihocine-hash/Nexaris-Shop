<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexaris Shop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <a class="logo" href="#">NEXARIS<span>SHOP</span></a>
  <nav><a href="#products">Produits</a><a href="#about">À propos</a></nav>
  <button class="cart-btn" onclick="openCart()">🛒 Panier <b id="cartCount">0</b></button>
</header>

<section class="hero">
  <div>
    <p class="eyebrow">NOUVELLE COLLECTION</p>
    <h1>Ton style.<br><span>Ton choix.</span></h1>
    <p>Chaussures et vêtements sélectionnés pour Nexaris Shop.</p>
    <a class="primary" href="#products">Découvrir la boutique</a>
  </div>
</section>

<main id="products">
  <div class="topbar">
    <div>
      <p class="eyebrow">NEXARIS SHOP</p>
      <h2>Nos produits</h2>
    </div>
    <input id="search" type="search" placeholder="Rechercher un produit..." oninput="renderProducts()">
  </div>
  <div class="filters">
    <button class="active" onclick="setFilter('Tous',this)">Tous</button>
    <button onclick="setFilter('Chaussures',this)">Chaussures</button>
    <button onclick="setFilter('Vêtements',this)">Vêtements</button>
  </div>
  <div id="productGrid" class="grid"></div>
</main>

<section id="about" class="about">
  <h2>Nexaris Shop</h2>
  <p>Une boutique simple et moderne pour découvrir tes prochaines pièces.</p>
</section>

<div id="overlay" class="overlay" onclick="closeCart()"></div>
<aside id="cart" class="cart">
  <div class="cart-head"><h2>Ton panier</h2><button onclick="closeCart()">✕</button></div>
  <div id="cartItems"></div>
  <div class="cart-foot">
    <div><span>Total</span><strong id="total">0,00 €</strong></div>
    <button class="primary full" onclick="checkout()">Commander</button>
  </div>
</aside>

<div id="toast" class="toast"></div>
<script src="script.js"></script>
</body>
</html>
